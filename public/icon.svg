<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)"/>
  
  <!-- Store / Cash Register Icon Graphic -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Register Base -->
    <rect x="20" y="160" width="280" height="130" rx="20" fill="#ffffff"/>
    <rect x="40" y="240" width="240" height="30" rx="8" fill="#e2e8f0"/>
    
    <!-- Screen -->
    <rect x="60" y="50" width="200" height="100" rx="14" fill="#0f172a"/>
    <rect x="74" y="64" width="172" height="72" rx="8" fill="#1e293b"/>
    <text x="160" y="110" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">Rp 250.000</text>
    
    <!-- Screen Stand -->
    <rect x="145" y="146" width="30" height="18" fill="#94a3b8"/>
    
    <!-- Keypad Grid -->
    <circle cx="75" cy="190" r="10" fill="#38bdf8"/>
    <circle cx="115" cy="190" r="10" fill="#38bdf8"/>
    <circle cx="155" cy="190" r="10" fill="#38bdf8"/>
    
    <circle cx="75" cy="216" r="10" fill="#94a3b8"/>
    <circle cx="115" cy="216" r="10" fill="#94a3b8"/>
    <circle cx="155" cy="216" r="10" fill="#94a3b8"/>
    
    <!-- Scanner Barcode / Receipt preview slot -->
    <rect x="200" y="180" width="80" height="42" rx="8" fill="#10b981"/>
    <path d="M216 201 L226 211 L246 191" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
